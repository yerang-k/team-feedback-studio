<title>팀 피드백 스튜디오</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 베이지 노아르: 무채색 + 베이지 하나. 상태 구분은 색이 아니라 모양(꽉 찬 것/점선/줄무늬)으로 한다. */
:root{
  --paper:#F4F4F2; --paper-raised:#FFFFFF; --ink:#1A1A1A; --ink-soft:#6B6B68; --line:#DCDCD8;
  --accent:#C9B18B; --accent-strong:#000000; --accent-soft:#F1EADD; --accent-dk:#6B5535;
  --btn-bg:#1C1C1C; --btn-ink:#FFFFFF; --btn-bg-hover:#000000;
  --bar:#1C1C1C; --bar-ink:#F4F4F2; --bar-sub:#A8A8A4;
  --gold:#1A1A1A; --gold-soft:#1C1C1C; --clay:#1A1A1A; --clay-soft:#F1EADD;
  --radius:14px; --shadow:0 2px 8px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111111; --paper-raised:#1E1E1C; --ink:#F4F4F2; --ink-soft:#A8A8A4; --line:#3A3A38;
    --accent:#C9B18B; --accent-strong:#E3D2B2; --accent-soft:rgba(201,177,139,.16); --accent-dk:#C9B18B;
    --btn-bg:#C9B18B; --btn-ink:#111111; --btn-bg-hover:#E3D2B2;
    --bar:#0A0A0A;
    --gold:#F4F4F2; --gold-soft:#F4F4F2; --clay:#F4F4F2; --clay-soft:rgba(201,177,139,.16);
    --shadow:0 2px 8px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --paper:#111111; --paper-raised:#1E1E1C; --ink:#F4F4F2; --ink-soft:#A8A8A4; --line:#3A3A38;
  --accent:#C9B18B; --accent-strong:#E3D2B2; --accent-soft:rgba(201,177,139,.16); --accent-dk:#C9B18B;
  --btn-bg:#C9B18B; --btn-ink:#111111; --btn-bg-hover:#E3D2B2;
  --bar:#0A0A0A;
  --gold:#F4F4F2; --gold-soft:#F4F4F2; --clay:#F4F4F2; --clay-soft:rgba(201,177,139,.16);
  --shadow:0 2px 8px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
html,body{margin:0; padding:0;}
body{background:var(--paper); color:var(--ink); font-family:'Noto Sans KR','Malgun Gothic',sans-serif; line-height:1.6;}
h1,h2,h3{font-family:'Noto Sans KR','Malgun Gothic',sans-serif; font-weight:700; text-wrap:balance; margin:0 0 .4em;}
button{font-family:inherit;}
a{color:var(--accent-dk);}
:focus-visible{outline:2px solid var(--accent-dk); outline-offset:2px;}
.muted{color:var(--ink-soft);}
.small{font-size:.82rem;}
.mono{font-variant-numeric:tabular-nums;}

.landing{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem 1.25rem;}
.landing-card{background:var(--paper-raised); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:16px; box-shadow:var(--shadow); padding:2.5rem 2rem; max-width:380px; width:100%; text-align:center;}
.wordmark-eyebrow{letter-spacing:.12em; font-size:.75rem; color:var(--accent-dk); font-weight:700; margin:0 0 .6rem;}
.wordmark{font-size:2.6rem; letter-spacing:.04em; margin:0 0 .25rem;}
.wordmark-sm{font-size:1.5rem; margin-bottom:.75rem;}
.tagline{color:var(--ink-soft); margin:0 0 1.75rem;}
.landing-actions{display:flex; flex-direction:column; gap:.6rem; margin-top:1.25rem;}
.notice{margin-top:1.25rem; font-size:.78rem; color:var(--ink-soft);}

.btn{border:none; border-radius:10px; padding:.85rem 1.1rem; font-size:.95rem; font-weight:700; cursor:pointer; transition:transform .1s ease, background .15s ease; display:inline-block; text-decoration:none; text-align:center;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--btn-bg); color:var(--btn-ink);}
.btn-primary:hover{background:var(--btn-bg-hover);}
.btn-ghost{background:transparent; border:1.5px solid var(--ink); color:var(--ink);}
.btn-ghost:hover{background:var(--accent-soft); border-color:var(--accent-dk); color:var(--ink);}
.btn-block{width:100%;}
.btn-sm{padding:.5rem .8rem; font-size:.82rem;}
.btn-team{background:var(--paper-raised); border:1.5px solid var(--line); border-radius:10px; padding:1rem; font-size:1.05rem; font-weight:700; cursor:pointer; color:var(--ink);}
.btn-team:hover{border-color:var(--ink); background:var(--accent-soft);}

.team-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:.65rem; margin-top:1rem;}

.input{width:100%; border:1.5px solid var(--line); border-radius:8px; padding:.8rem 1rem; font-size:1rem; background:var(--paper-raised); color:var(--ink); margin-top:1rem;}
.input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--ink);}
.input-lg{text-align:center; font-size:1.3rem; letter-spacing:.15em;}
.form-error{color:var(--ink); font-weight:700; font-size:.85rem; min-height:1.2em; margin-top:.5rem;}
.form-error:not(:empty)::before{content:"⚠ ";}
.link-sm{display:inline-block; margin-top:.4rem; font-size:.85rem; text-decoration:none;}

/* 상단 바: 검은 바탕 + 아래 베이지 선 */
.sbar{display:flex; align-items:center; flex-wrap:wrap; gap:.4rem .6rem; padding:.9rem 1.1rem; border-bottom:3px solid var(--accent); background:var(--bar); color:var(--bar-ink); position:sticky; top:0; z-index:5;}
.sbar-brand{font-weight:700; letter-spacing:.03em; color:var(--bar-ink);}
.sbar-tagline{font-weight:400; font-size:.72rem; color:var(--bar-sub); margin-left:.3rem; letter-spacing:0;}
.tbar-tagline{font-weight:400; font-size:.78rem; color:var(--bar-sub); margin-left:.3rem; letter-spacing:0;}
.class-badge{display:inline-block; background:var(--accent); color:#1C1C1C; font-weight:700; font-size:.72rem; padding:.2rem .6rem; border-radius:999px; margin-left:.4rem; vertical-align:middle;}
.sbar-team{margin-left:auto; background:rgba(255,255,255,.14); color:var(--bar-ink); font-weight:700; font-size:.8rem; padding:.25rem .7rem; border-radius:999px;}
.student-main{max-width:520px; margin:0 auto; padding:1.5rem 1.1rem 3rem;}
.center-msg{min-height:50vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:.4rem;}
.eyebrow{letter-spacing:.1em; font-size:.75rem; color:var(--accent-dk); font-weight:700; margin:0 0 .3rem;}

.fb-form .q{font-size:1rem; margin:1.5rem 0 .6rem;}
.hint{color:var(--ink-soft); font-weight:400; font-size:.85rem;}
.chip-group{display:flex; flex-wrap:wrap; gap:.5rem;}
.chip{border:1.5px solid var(--line); background:var(--paper-raised); color:var(--ink); border-radius:999px; padding:.55rem 1rem; font-size:.88rem; cursor:pointer;}
.chip:disabled{opacity:.4; cursor:not-allowed;}
.chip-on{background:var(--btn-bg); border:1.5px solid var(--btn-bg); color:var(--btn-ink); font-weight:700;}
/* 강점은 꽉 찬 알약, 개선점은 점선 테두리 알약으로 모양을 구분 */
.chip-on.chip-gold{background:var(--btn-bg); border-color:var(--btn-bg); color:var(--btn-ink);}
.chip-on.chip-clay{background:var(--accent-soft); border:2px dashed var(--ink); color:var(--ink);}
.chip-warn{min-height:1.1em; color:var(--ink); font-weight:700; font-size:.8rem; margin-top:.4rem;}
.chip-warn:not(:empty)::before{content:"⚠ ";}
.textarea{width:100%; min-height:88px; border:1.5px solid var(--line); border-radius:10px; padding:.8rem 1rem; font-size:.95rem; margin-top:.6rem; font-family:inherit; resize:vertical; background:var(--paper-raised); color:var(--ink);}
.textarea:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--ink);}
.counter{text-align:right; font-size:.78rem; color:var(--ink-soft); margin-top:.3rem;}
.submitted-tag{display:inline-block; background:var(--accent-soft); color:var(--accent-dk); font-weight:700; font-size:.8rem; padding:.3rem .7rem; border-radius:999px; margin-bottom:.5rem;}

.bars{display:flex; flex-direction:column; gap:.5rem;}
.bar-row{display:grid; grid-template-columns:1fr 2fr auto; align-items:center; gap:.6rem;}
.bar-label{font-size:.85rem;}
.bar-track{background:var(--line); border-radius:999px; height:10px; overflow:hidden;}
.bar-fill{height:100%; border-radius:999px; transition:width .5s ease;}
.bar-gold{background:var(--ink);}
.bar-clay{background:repeating-linear-gradient(45deg, var(--accent-dk) 0 5px, var(--accent) 5px 10px);}
.bar-count{font-size:.8rem; color:var(--ink-soft); text-align:right; min-width:1.6em;}
@media (prefers-reduced-motion:reduce){ .bar-fill{transition:none;} }

.result-view{padding-bottom:2rem;}
.voice-cards{display:flex; flex-direction:column; gap:.6rem;}
.voice-card-sm{background:var(--paper-raised); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:10px; padding:.75rem 1rem; font-size:.88rem;}
.submitted-box{margin-top:1.5rem; padding:1rem; border:1px solid var(--line); border-radius:12px; background:var(--paper-raised);}

.tbar{display:flex; align-items:center; gap:1rem; padding:1rem 1.5rem; border-bottom:3px solid var(--accent); background:var(--bar); color:var(--bar-ink); flex-wrap:wrap;}
.tbar-brand{font-weight:700; font-size:1.1rem; letter-spacing:.03em; color:var(--bar-ink);}
.tbar-sub{font-size:.75rem; color:var(--bar-sub); font-weight:400; margin-left:.4rem;}
.tbar-actions{margin-left:auto; display:flex; align-items:center; gap:1rem;}
.tbar .btn-ghost, .sbar .btn-ghost{border-color:rgba(255,255,255,.4); color:var(--bar-ink);}
.tbar .btn-ghost:hover, .sbar .btn-ghost:hover{background:rgba(255,255,255,.12); border-color:var(--accent); color:var(--bar-ink);}
.tbar .link-sm, .sbar .link-sm{color:var(--accent);}
.teacher-main{padding:1.25rem 1.5rem 3rem;}
.teacher-grid{display:grid; grid-template-columns:360px 1fr; gap:1.25rem; align-items:start;}
@media (max-width:920px){ .teacher-grid{grid-template-columns:1fr;} }

.control-rail{display:flex; flex-direction:column; gap:.9rem;}
.panel{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); padding:1rem 1.1rem; box-shadow:var(--shadow);}
.panel h3{font-size:.95rem; margin:0 0 .6rem;}
.panel summary{cursor:pointer; font-weight:700; font-size:.9rem; display:flex; align-items:center; justify-content:space-between;}
.fb-row{border-top:1px solid var(--line); padding:.55rem 0;}
.fb-row:first-of-type{border-top:none;}
.fb-row summary{list-style:none;}
.fb-row summary::-webkit-details-marker{display:none;}
.tag{font-size:.72rem; font-weight:700; padding:.2rem .55rem; border-radius:999px; background:var(--line); color:var(--ink-soft);}
.tag-done{background:var(--btn-bg); color:var(--btn-ink);}
.tag-pending{background:transparent; border:1.5px dashed var(--ink-soft); color:var(--ink-soft);}
.fb-detail{padding:.6rem .2rem .3rem; font-size:.85rem; display:flex; flex-direction:column; gap:.3rem;}
.mini-row{display:flex; justify-content:space-between; padding:.4rem 0; border-top:1px solid var(--line); font-size:.85rem;}
.mini-row:first-of-type{border-top:none;}
.team-edit-row{display:grid; grid-template-columns:1.3fr 1fr auto; gap:.4rem;}
.team-edit-block{margin-bottom:.9rem; padding-bottom:.9rem; border-bottom:1px solid var(--line);}
.team-edit-block:last-of-type{border-bottom:none; margin-bottom:0; padding-bottom:0;}
.team-edit-list{margin-top:.6rem;}
.row-actions{display:flex; gap:.5rem; margin-top:.6rem; flex-wrap:wrap;}
.review-item{border-top:1px solid var(--line); padding:.7rem 0; font-size:.88rem;}
.review-item:first-of-type{border-top:none;}

/* 무대 화면(프로젝터): 어두운 바탕 + 베이지 포인트 */
.stage{
  --s-bg:#111111; --s-ink:#F4F4F2; --s-soft:#A8A8A4; --s-accent:#C9B18B; --s-gold:#F4F4F2; --s-clay:#C9B18B; --s-line:#3A3A38;
  background:var(--s-bg); color:var(--s-ink); border-radius:14px; padding:2.5rem 2.75rem; min-height:460px; display:flex; align-items:center; box-shadow:var(--shadow);
}
.stage-only-wrap{min-height:100vh; position:relative;}
.stage-fs-btn{position:fixed; top:.8rem; right:.8rem; z-index:20; opacity:.4; border-color:#A8A8A4; color:#F4F4F2;}
.stage-fs-btn:hover{opacity:1;}
.stage.stage-full{min-height:100vh; border-radius:0; box-shadow:none; padding:4vh 5vw;}
.stage-inner{width:100%;}
.stage .stage-eyebrow{letter-spacing:.12em; font-size:.85rem; color:var(--s-accent); font-weight:700; margin:0 0 .5rem;}
.stage .stage-team{font-size:3rem; margin:0; color:var(--s-ink);}
.stage .stage-hint{color:var(--s-soft); margin-top:.6rem;}
.stage .slide-embed{width:100%; aspect-ratio:16/9; border-radius:10px;}
.stage .slide-open-link{display:inline-block; margin-top:.6rem; color:var(--s-accent);}
.stage .stage-count{font-size:1.6rem; font-weight:700; margin-top:1.2rem;}
.stage .bars .bar-track{background:var(--s-line);}
.stage .bars .bar-label{color:var(--s-ink);}
.stage .bars .bar-count{color:var(--s-soft);}
.stage .bar-gold{background:var(--s-gold);}
.stage .bar-clay{background:repeating-linear-gradient(45deg, var(--s-clay) 0 6px, #7A6644 6px 12px);}
.stage .voice-card{border-left:4px solid var(--s-accent); padding:.4rem 0 .4rem 1rem; margin:1.2rem 0 0; color:var(--s-ink);}
.stage .all-result-row{display:flex; justify-content:space-between; gap:1rem; padding:.6rem 0; border-top:1px solid var(--s-line); font-size:1.05rem;}
.stage .all-result-row:first-of-type{border-top:none;}
.stage .all-result-team{font-weight:700; color:var(--s-accent); min-width:3.5em;}
.stage .stage-empty{color:var(--s-soft);}

/* 전자칠판/프로젝터에 띄우는 무대 화면은 멀리서도 보이도록 글자를 훨씬 크게 (대시보드에 작게 끼워진 미리보기에도 동일 적용) */
.stage .stage-eyebrow{font-size:1.7rem;}
.stage .stage-team{font-size:5.2rem;}
.stage .stage-hint{font-size:1.5rem;}
.stage .stage-count{font-size:3.2rem;}
.stage .bars{gap:1rem;}
.stage .bars .bar-row{gap:1rem;}
.stage .bars .bar-label{font-size:1.6rem;}
.stage .bars .bar-count{font-size:1.4rem;}
.stage .bars .bar-track{height:22px;}
.stage .voice-card{font-size:1.4rem;}
.stage .all-result-row{font-size:1.7rem; padding:.9rem 0;}
.stage .stage-empty{font-size:1.4rem;}
</style>

<div id="app"></div>

<script>
var STRENGTHS = [];
var IMPROVEMENTS = [];
var APP_NAME = <?!= JSON.stringify(appName) ?>;
var APP_SUBTITLE = <?!= JSON.stringify(appSubtitle) ?>;
var INITIAL_ROLE = <?!= JSON.stringify(initialRole) ?>;
var INITIAL_VIEW = <?!= JSON.stringify(initialView) ?>;
var CLASS_ID = <?!= JSON.stringify(initialClass) ?>;
var REFLECTION_AREAS = ['문제를 바라보는 방식','자료를 찾고 활용하는 방식','문제의 원인 분석','해결 방안','해결 방안의 실현 가능성','발표/매체','다른 관점','특별히 없음'];

/* ---------- 전역 상태 ---------- */
var state = null, feedbackDocs = [], reflectionDocs = [], spreadsheetUrl = '', webAppUrl = '', classList = [];
if (INITIAL_ROLE) { try { localStorage.setItem('rs_role', INITIAL_ROLE); } catch (e) {} }
var myRole = INITIAL_ROLE || localStorage.getItem('rs_role');
var myTeam = loadLocal('rs_team__' + CLASS_ID, null);
var myStudent = loadLocal('rs_student__' + CLASS_ID, null);
var teacherAuthed = sessionStorage.getItem('rs_teacher_ok__' + CLASS_ID) === '1';
var pendingTeamId = null, authError = '';
var chipWarnMsg = '';
var drafts = {
  feedback: {forKey: null, strengths: [], improvements: [], comment: ''},
  reflection: {forKey: null, area: '', reason: ''},
  teamCode: '', pin: '', newPin: '', draftTeams: null, mySlideUrl: null, newClass: '', studentNo: '', studentName: '', slideStatus: '',
  appName: null, appSubtitle: null, draftStrengths: null, draftImprovements: null
};
var openPanels = {review: true};
function panelOpenAttr(key) { return openPanels[key] ? ' open' : ''; }

/* 발표자료 iframe은 브라우저 특성상 DOM에서 떼었다 붙이면 새로고침되므로,
   화면 재구성과 별개로 body에 상주시키고 위치만 매번 맞춰준다. */
var slideFrame = document.createElement('iframe');
slideFrame.id = 'persistentSlideFrame';
slideFrame.setAttribute('allowfullscreen', '');
slideFrame.style.cssText = 'position:absolute; display:none; border:1px solid #3A3A38; border-radius:10px; background:#111111; z-index:5;';
document.body.appendChild(slideFrame);
var slideFrameKey = null;
function repositionSlideFrame() {
  var slot = document.querySelector('.slide-embed');
  if (!slot) { slideFrame.style.display = 'none'; return; }
  var rect = slot.getBoundingClientRect();
  slideFrame.style.top = (rect.top + window.scrollY) + 'px';
  slideFrame.style.left = (rect.left + window.scrollX) + 'px';
  slideFrame.style.width = rect.width + 'px';
  slideFrame.style.height = rect.height + 'px';
  slideFrame.style.display = 'block';
  var key = slot.getAttribute('data-slide-key');
  if (key !== slideFrameKey) {
    slideFrame.src = slot.getAttribute('data-slide-src');
    slideFrameKey = key;
  }
}
window.addEventListener('resize', repositionSlideFrame);
window.addEventListener('scroll', repositionSlideFrame, true);
function panelToggleAttr(key) { return ' ontoggle="openPanels[\'' + key + '\']=this.open"'; }

function loadLocal(key, fallback) {
  try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
}
function saveLocal(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function containsBadWordClient(text) {
  var bad = ['씨발','시발','병신','개새끼','좆같','지랄','미친놈','미친년'];
  return bad.some(function (w) { return text.indexOf(w) > -1; });
}
function labelOf(catalog, id) { var it = catalog.filter(function(o){return o.id===id;})[0]; return it ? it.label : id; }
function teamName(id) {
  var t = ((state && state.teams) || []).filter(function(t){return t.id===id;})[0];
  return t ? t.name : '(삭제된 팀)';
}
function teamOf(id) {
  return ((state && state.teams) || []).filter(function(t){return t.id===id;})[0] || null;
}
function classLabel() { return CLASS_ID === 'default' ? '처음 만든 반' : CLASS_ID; }
function teamsWithFeedback() {
  return (state.teams || []).filter(function(t){ return feedbackDocs.some(function(d){ return d.toTeamId===t.id; }); });
}
function normalizeSlideUrl(url) {
  url = (url || '').trim();
  if (!url) return '';
  var m = url.match(/^https:\/\/docs\.google\.com\/presentation\/d\/([^/]+)/);
  if (m) return 'https://docs.google.com/presentation/d/' + m[1] + '/embed?start=false&loop=false&delayms=3000';
  m = url.match(/^https:\/\/drive\.google\.com\/file\/d\/([^/]+)/);
  if (m) return 'https://drive.google.com/file/d/' + m[1] + '/preview';
  return url;
}
function tally(docs, teamId, field, catalog) {
  var counts = {};
  docs.filter(function(d){return d.toTeamId===teamId;}).forEach(function(d){
    (d[field] || []).forEach(function(id){ counts[id] = (counts[id] || 0) + 1; });
  });
  return Object.keys(counts).map(function(id){ return {id:id, label:labelOf(catalog,id), count:counts[id]}; })
    .sort(function(a,b){ return b.count - a.count; });
}
function participantCount(teamId) {
  return feedbackDocs.filter(function(d){return d.toTeamId===teamId;}).length;
}
function barsHtml(tallyArr, colorClass) {
  if (!tallyArr.length) return '<p class="stage-empty">아직 응답이 없어요.</p>';
  var max = tallyArr[0].count || 1;
  return tallyArr.map(function(t){
    var w = Math.max(6, Math.round(t.count / max * 100));
    return '<div class="bar-row"><span class="bar-label">' + esc(t.label) + '</span>' +
      '<div class="bar-track"><div class="bar-fill ' + colorClass + '" style="width:' + w + '%"></div></div>' +
      '<span class="bar-count">' + t.count + '</span></div>';
  }).join('');
}

/* ---------- 서버 폴링 ---------- */
function pollSnapshot() {
  google.script.run.withSuccessHandler(onSnapshot).withFailureHandler(function(e){ console.error(e); }).getSnapshot(CLASS_ID);
}
function onSnapshot(snap) {
  state = snap.state; feedbackDocs = snap.feedback; reflectionDocs = snap.reflections;
  spreadsheetUrl = snap.spreadsheetUrl; webAppUrl = snap.webAppUrl; classList = snap.classes || classList;
  if (state.strengths) STRENGTHS = state.strengths;

    setSlideError('파일을 읽는 중이에요...');

        var base64 = String(reader.result).split(',')[1] || '';

          if (settled) return;

          setSlideError('응답이 너무 오래 걸려요. 파일이 크거나 연결이 불안정한 것 같아요. 잠시 후 다시 시도하거나 링크로 저장하는 방법을 이용해주세요.');

          })
          .withFailureHandler(function (err) {

      } catch (e2) { setSlideError('업로드 준비 중 오류: ' + (e2 && e2.message ? e2.message : e2)); }
    };
    reader.onerror = function () { setSlideError('파일을 읽는 데 실패했어요.'); };
    reader.readAsDataURL(file);
  } catch (e) { setSlideError('오류가 발생했어요: ' + (e && e.message ? e.message : e)); }
};

    .withSuccessHandler(function(){ setRefError(''); pollSnapshot(); })
    .withFailureHandler(function(err){ setRefError(err && err.message ? err.message : '제출에 실패했어요.'); })

function phaseSwitcher() {

window.pickCurrentTeam = function (id) {
  if (id === state.currentTeamId) return;

window.setPhase = function (p) { google.script.run.withSuccessHandler(onStateUpdated).withFailureHandler(alertErr).updateState(CLASS_ID, {phase: p}); };
function phaseControls() {
  if (state.phase === 'FEEDBACK' && state.currentTeamId) return feedbackChecklist(state.currentTeamId);
  return '';
}
function feedbackChecklist(currentTeamId) {
  var others = state.teams.filter(function(t){return t.id!==currentTeamId;});
  var totalCount = 0;
  var rows = others.map(function(t){
    var docs = feedbackDocs.filter(function(d){return d.fromTeamId===t.id && d.toTeamId===currentTeamId;});
    totalCount += docs.length;
    var inner = docs.length
      ? docs.map(feedbackDetailHtml).join('')
      : '<p class="muted">아직 제출한 학생이 없어요.</p>';
    return '<details class="fb-row"><summary><span>' + esc(t.name) + '</span>' +
      '<span class="tag ' + (docs.length?'tag-done':'tag-pending') + '">' + docs.length + '명 제출</span></summary>' + inner + '</details>';
  }).join('');
  return '<div class="panel"><h3>피드백 제출 현황 <span class="mono">' + totalCount + '명</span></h3>' + rows + '</div>';
}
function feedbackDetailHtml(d) {
  return '<div class="fb-detail">' +
    (d.fromStudent ? '<p><b>보낸 사람</b> ' + esc(d.fromStudent) + '</p>' : '') +
    '<p><b>강점</b> ' + (d.strengths.map(function(id){return esc(labelOf(STRENGTHS,id));}).join(', ') || '-') + '</p>' +
    '<p><b>개선점</b> ' + (d.improvements.map(function(id){return esc(labelOf(IMPROVEMENTS,id));}).join(', ') || '-') + '</p>' +
    '<p><b>의견</b> "' + esc(d.comment || '') + '"</p>' +
    '<p class="muted small">' + esc(new Date(d.submittedAt).toLocaleTimeString('ko-KR')) + '</p></div>';
}
function feedbackLogPanel() {
  if (!feedbackDocs.length) return '<details class="panel"' + panelOpenAttr('log') + panelToggleAttr('log') + '><summary>피드백 전체 기록</summary><p class="muted">아직 기록이 없어요.</p></details>';
  var sorted = feedbackDocs.slice().sort(function(a,b){ return a.submittedAt < b.submittedAt ? 1 : -1; });
  var rows = sorted.map(function(d){
    var tagText = d.approved===true ? '의견 공개' : (d.approved===false ? '의견 비공개' : '검토 대기');
    var tagClass = d.approved===true ? 'tag-done' : (d.approved===false ? 'tag-pending' : '');
    var fromLabel = esc(teamName(d.fromTeamId)) + (d.fromStudent ? ' (' + esc(d.fromStudent) + ')' : '');
    return '<details class="fb-row"><summary><span>' + fromLabel + ' → ' + esc(teamName(d.toTeamId)) + '</span>' +

  }).join('');

}
window.onOptionsToggle = function (el) {
  openPanels.options = el.open;
  if (el.open) {
    if (!drafts.draftStrengths) drafts.draftStrengths = STRENGTHS.map(function(o){return {id:o.id, label:o.label};});
    if (!drafts.draftImprovements) drafts.draftImprovements = IMPROVEMENTS.map(function(o){return {id:o.id, label:o.label};});
  }
};
window.onDraftOptionField = function (key, i, val) { drafts[key][i].label = val; };
window.addDraftOption = function (key) {
  drafts[key] = drafts[key] || (key === 'draftStrengths' ? STRENGTHS : IMPROVEMENTS).map(function(o){return {id:o.id, label:o.label};});
  drafts[key].push({id: (key === 'draftStrengths' ? 's' : 'i') + Date.now().toString(36), label: ''});
  render();
};
window.removeDraftOption = function (key, i) { drafts[key].splice(i, 1); render(); };
window.saveOptionCatalog = function () {
  var s = drafts.draftStrengths || STRENGTHS;
  var i = drafts.draftImprovements || IMPROVEMENTS;
  google.script.run.withSuccessHandler(function(newState){ drafts.draftStrengths=null; drafts.draftImprovements=null; onStateUpdated(newState); })
    .withFailureHandler(alertErr).saveOptionCatalog(CLASS_ID, {strengths:s, improvements:i});
};

function pinPanel() {
  return '<details class="panel"' + panelOpenAttr('pin') + panelToggleAttr('pin') + '><summary>교사 PIN 변경</summary>' +
    '<div class="row-actions"><input class="input mono" style="margin-top:0" placeholder="새 PIN" value="' + esc(drafts.newPin) + '" oninput="drafts.newPin=this.value" maxlength="8">' +
    '<button class="btn btn-ghost btn-sm" onclick="changePin()">변경</button></div></details>';
}
window.changePin = function () {
  var v = (drafts.newPin || '').trim();
  if (!v) { alert('새 PIN을 입력해주세요.'); return; }
  google.script.run.withSuccessHandler(function(newState){ drafts.newPin=''; onStateUpdated(newState); alert('PIN이 변경되었어요.'); })
    .withFailureHandler(alertErr).changePin(CLASS_ID, v);
};

function screenStageOnly() {
  var fsBtn = '<button class="btn btn-ghost btn-sm stage-fs-btn" onclick="toggleFullscreen()">전체 화면 전환</button>';
  if (!state) return '<div class="stage-only-wrap">' + fsBtn + '<section class="stage stage-full"><div class="stage-inner"><p class="muted">불러오는 중...</p></div></section></div>';
  return '<div class="stage-only-wrap">' + fsBtn + '<section class="stage stage-full">' + teacherStage() + '</section></div>';
}
window.toggleFullscreen = function () {
  if (document.fullscreenElement) { document.exitFullscreen(); }
  else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
};
function teacherStage() {
  var body = '';
  if (state.phase === 'PRESENTATION') {
    var pTeam = state.currentTeamId ? teamOf(state.currentTeamId) : null;
    if (!pTeam) {
      body = '<p class="stage-eyebrow">잠시만요</p><h1 class="stage-team">발표팀을 선택해주세요</h1>';
    } else if (pTeam.slideUrl) {
      var slideSrc = normalizeSlideUrl(pTeam.slideUrl);
      var slideKey = pTeam.id + '::' + slideSrc;
      body = '<p class="stage-eyebrow">지금 발표하는 팀 · ' + esc(pTeam.name) + '</p>' +
        '<div class="slide-embed" data-slide-key="' + esc(slideKey) + '" data-slide-src="' + esc(slideSrc) + '"></div>' +
        '<a class="link-sm slide-open-link" href="' + esc(pTeam.slideUrl) + '" target="_blank" rel="noopener">화면이 안 뜨면 새 창에서 열기 →</a>';
    } else {
      body = '<p class="stage-eyebrow">지금 발표하는 팀</p><h1 class="stage-team">' + esc(pTeam.name) + '</h1>' +
        '<p class="stage-hint">팀 관리에서 발표자료 링크를 등록하면 여기에 자동으로 표시돼요.</p>';
    }
  } else if (state.phase === 'FEEDBACK') {
    var count = participantCount(state.currentTeamId);
    var liveSt = tally(feedbackDocs, state.currentTeamId, 'strengths', STRENGTHS).slice(0, 5);
    var liveIm = tally(feedbackDocs, state.currentTeamId, 'improvements', IMPROVEMENTS).slice(0, 5);
    body = '<p class="stage-eyebrow">🔎 ' + esc(teamName(state.currentTeamId)) + ' 발표 피드백</p>' +
      '<p class="stage-hint">발표를 듣고 의견을 보내주세요</p>' +
      '<p class="stage-count">현재 참여 <b>' + count + '</b>명</p>' +
      '<p class="stage-eyebrow" style="margin-top:1.4rem">실시간 강점</p>' +
      '<div class="bars">' + barsHtml(liveSt, 'bar-gold') + '</div>' +
      '<p class="stage-eyebrow" style="margin-top:1.2rem">실시간 개선점</p>' +
      '<div class="bars">' + barsHtml(liveIm, 'bar-clay') + '</div>';
  } else if (state.phase === 'RESULT') {
    var st = tally(feedbackDocs, state.currentTeamId, 'strengths', STRENGTHS).slice(0, 5);
    var im = tally(feedbackDocs, state.currentTeamId, 'improvements', IMPROVEMENTS).slice(0, 5);
    var comments = feedbackDocs.filter(function(d){return d.toTeamId===state.currentTeamId && d.approved===true && d.comment;});
    var quote = comments.length ? comments[Math.floor(Math.random()*comments.length)] : null;
    body = '<p class="stage-eyebrow">' + esc(teamName(state.currentTeamId)) + ' 발표에서 발견한 강점</p>' +
      '<div class="bars">' + barsHtml(st, 'bar-gold') + '</div>' +
      '<p class="stage-eyebrow" style="margin-top:1.5rem">한 단계 더 생각한다면</p>' +
      '<div class="bars">' + barsHtml(im, 'bar-clay') + '</div>' +
      (quote ? '<blockquote class="voice-card">"' + esc(quote.comment) + '"</blockquote>' : '');
  } else if (state.phase === 'ALL_RESULT') {
    body = '<p class="stage-eyebrow">🔎 오늘 우리가 발견한 탐구들</p><div class="all-result-list">' +
      teamsWithFeedback().map(function(t){
        var top = tally(feedbackDocs, t.id, 'strengths', STRENGTHS)[0];
        return '<div class="all-result-row"><span class="all-result-team">' + esc(t.name) + '</span><span>' + (top?esc(top.label):'응답 없음') + '</span></div>';
      }).join('') + '</div>';
  } else if (state.phase === 'REFLECTION') {
    body = '<p class="stage-eyebrow">우리 탐구를 다시 보다</p>' +
      '<p class="stage-hint">친구들의 피드백을 살펴보고 우리 팀의 탐구를 다시 바라보는 시간이에요</p>' +
      '<p class="stage-count">' + reflectionDocs.length + ' / ' + state.teams.length + '팀 제출 완료</p>';
  }
  return '<div class="stage-inner">' + body + '</div>';
}

/* ---------- 시작 ---------- */
pollSnapshot();
setInterval(pollSnapshot, 3000);
render();
</script>
